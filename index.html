
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MONDAI CLOCK 3.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#101827;color:white;transition:.3s}
body.light{background:#eef2f8;color:#172033}
.app{max-width:650px;margin:auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:900;letter-spacing:4px;color:#60a5fa}
button,input{font:inherit}
button{cursor:pointer;border:1px solid #8885;border-radius:12px;padding:12px 16px;background:#8882;color:inherit}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:28px 0 18px;background:#8882;padding:5px;border-radius:14px}
.tabs button{font-size:12px;padding:12px 2px;border:0}
.tabs button.active,.primary{background:#2563eb;color:white}
.panel{display:none;text-align:center;padding:25px 8px}
.panel.active{display:block}
.time{font-size:clamp(48px,12vw,78px);font-weight:300;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.sub{opacity:.6;font-size:13px;letter-spacing:2px}
.card{background:#8882;border:1px solid #8883;padding:17px;border-radius:14px;margin-top:20px}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:24px}
input{width:85px;padding:12px;border-radius:10px;border:1px solid #8888;background:#8882;color:inherit;text-align:center}
.world{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:15px;background:#8882;border-radius:12px;margin:9px 0}
.citytime{font-size:20px;font-variant-numeric:tabular-nums}
footer{display:flex;justify-content:space-between;border-top:1px solid #8885;margin-top:25px;padding-top:18px;font-size:11px;opacity:.5}
</style>
</head>
<body>
<div class="app">
<header>
<div>
<div class="logo">MONDAI</div>
<div class="sub">DIGITAL CLOCK SYSTEM</div>
</div>
<button id="theme">☀️ ライト</button>
</header>

<div class="tabs">
<button class="active" data-tab="clock">時計</button>
<button data-tab="timer">タイマー</button>
<button data-tab="world">世界時計</button>
<button data-tab="stopwatch">ストップ<br>ウォッチ</button>
</div>

<section class="panel active" id="clock">
<div class="sub">JAPAN STANDARD TIME</div>
<div class="time" id="mainTime">00:00:00</div>
<div id="mainDate"></div>
<div class="card" style="text-align:left">
<div class="sub">TODAY</div>
<div id="day" style="font-size:25px;margin-top:8px"></div>
<div class="sub">UTC +09:00 · Asia/Tokyo</div>
</div>
</section>

<section class="panel" id="timer">
<div class="sub">COUNTDOWN TIMER</div>
<div class="time" id="timerDisplay">05:00</div>
<div class="controls">
<label>分 <input id="minutes" type="number" min="0" max="999" value="5"></label>
<label>秒 <input id="seconds" type="number" min="0" max="59" value="0"></label>
</div>
<div class="controls">
<button class="primary" id="timerStart">スタート</button>
<button id="timerReset">リセット</button>
</div>
<p id="timerMessage">時間を設定してください</p>
</section>

<section class="panel" id="world">
<div class="sub">WORLD TIME ZONES</div>
<div id="cities"></div>
</section>

<section class="panel" id="stopwatch">
<div class="sub">STOPWATCH</div>
<div class="time" id="swDisplay">00:00.00</div>
<div class="controls">
<button class="primary" id="swStart">スタート</button>
<button id="swLap">ラップ</button>
<button id="swReset">リセット</button>
</div>
<div id="laps"></div>
</section>

<footer>
<span>MONDAI LIMITED</span>
<span>VERSION 3.0</span>
</footer>
</div>

<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');

// タブ切り替え
document.querySelectorAll('[data-tab]').forEach(btn=>{
btn.addEventListener('click',()=>{
document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
document.querySelectorAll('[data-tab]').forEach(b=>b.classList.remove('active'));
$(btn.dataset.tab).classList.add('active');
btn.classList.add('active');
});
});

// ライト・ダーク
let light=false;
$('theme').onclick=()=>{
light=!light;
document.body.classList.toggle('light',light);
$('theme').textContent=light?'🌙 ダーク':'☀️ ライト';
};

// デジタル時計
function updateClock(){
const d=new Date();
$('mainTime').textContent=
[pad(d.getHours()),pad(d.getMinutes()),pad(d.getSeconds())].join(':');
$('mainDate').textContent=
d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
$('day').textContent=
['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'][d.getDay()];
}
setInterval(updateClock,1000);
updateClock();

// 世界時計
const zones=[
['東京','Asia/Tokyo'],
['ロンドン','Europe/London'],
['ニューヨーク','America/New_York'],
['パリ','Europe/Paris'],
['シンガポール','Asia/Singapore'],
['シドニー','Australia/Sydney'],
['ロサンゼルス','America/Los_Angeles']
];
function updateWorld(){
const now=new Date();
$('cities').innerHTML=zones.map(([name,zone])=>{
const time=new Intl.DateTimeFormat('ja-JP',{
timeZone:zone,hour:'2-digit',minute:'2-digit',
second:'2-digit',hour12:false
}).format(now);
const date=new Intl.DateTimeFormat('ja-JP',{
timeZone:zone,month:'numeric',day:'numeric',weekday:'short'
}).format(now);
return `<div class="world">
<div><strong>${name}</strong><div class="sub">${date}</div></div>
<div class="citytime">${time}</div>
</div>`;
}).join('');
}
updateWorld();
setInterval(updateWorld,1000);

// タイマー
let remaining=300;
let timerRunning=false;
let timerEnd=0;
let timerInterval=null;

function timerDisplay(){
$('timerDisplay').textContent=
pad(Math.floor(remaining/60))+':'+pad(remaining%60);
}
function stopTimer(){
timerRunning=false;
clearInterval(timerInterval);
timerInterval=null;
$('timerStart').textContent='スタート';
}
function timerTick(){
remaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));
timerDisplay();
if(remaining===0){
stopTimer();
$('timerMessage').textContent='⏰ 時間になりました！';
}
}
$('timerStart').onclick=()=>{
if(timerRunning){
stopTimer();
$('timerMessage').textContent='一時停止中';
return;
}
if(remaining<=0){
remaining=Math.min(59999,
Math.max(0,(Number($('minutes').value)||0)*60+
(Number($('seconds').value)||0)));
}
if(remaining<=0){
$('timerMessage').textContent='時間を設定してください';
return;
}
timerRunning=true;
timerEnd=Date.now()+remaining*1000;
$('timerStart').textContent='一時停止';
$('timerMessage').textContent='カウントダウン中';
timerTick();
timerInterval=setInterval(timerTick,100);
};
$('timerReset').onclick=()=>{
stopTimer();
remaining=Math.min(59999,
Math.max(0,(Number($('minutes').value)||0)*60+
(Number($('seconds').value)||0)));
timerDisplay();
$('timerMessage').textContent='リセットしました';
};
timerDisplay();

// ストップウォッチ
let swRunning=false;
let swStart=0;
let swElapsed=0;
let swInterval=null;
let laps=[];
function swValue(){
return swElapsed+(swRunning?Date.now()-swStart:0);
}
function swDraw(){
const n=swValue();
$('swDisplay').textContent=
pad(Math.floor(n/60000))+':'+
pad(Math.floor(n/1000)%60)+'.'+
pad(Math.floor(n/10)%100);
}
$('swStart').onclick=()=>{
if(swRunning){
swElapsed=swValue();
swRunning=false;
clearInterval(swInterval);
$('swStart').textContent='再開';
}else{
swStart=Date.now();
swRunning=true;
$('swStart').textContent='一時停止';
clearInterval(swInterval);
swInterval=setInterval(swDraw,30);
}
swDraw();
};
$('swLap').onclick=()=>{
if(!swRunning)return;
const n=swValue();
laps.unshift(
pad(Math.floor(n/60000))+':'+
pad(Math.floor(n/1000)%60)+'.'+
pad(Math.floor(n/10)%100)
);
$('laps').innerHTML=laps.map((v,i)=>
`<div class="world"><span>ラップ ${laps.length-i}</span><strong>${v}</strong></div>`
).join('');
};
$('swReset').onclick=()=>{
swRunning=false;
clearInterval(swInterval);
swElapsed=0;
laps=[];
$('swStart').textContent='スタート';
$('laps').innerHTML='';
swDraw();
};
swDraw();
</script>
</body>
</html>
